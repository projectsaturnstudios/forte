name: spec tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  autobahn:
    name: Autobahn - ${{ matrix.loop }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        loop: [epoll, select]

    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip
          tools: composer, pie
          coverage: none

      - name: Install ext-epoll
        if: matrix.loop == 'epoll'
        run: sudo pie install php-io-extensions/epoll

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Pull the Autobahn image
        run: docker pull crossbario/autobahn-testsuite

      - name: Start the echo server
        working-directory: tests/Specification
        run: FORTE_LOOP=${{ matrix.loop }} php -d memory_limit=1G spec-server.php &

      - name: Run the fuzzing client
        working-directory: tests/Specification
        run: |
          docker run --rm \
            -v $PWD:/mnt/autobahn \
            -v $PWD/reports:/mnt/autobahn/reports \
            --add-host host.docker.internal:host-gateway \
            crossbario/autobahn-testsuite \
            wstest -m fuzzingclient -s /mnt/autobahn/client-spec.json

      - name: Analyze
        working-directory: tests/Specification
        run: php spec-analyze.php
