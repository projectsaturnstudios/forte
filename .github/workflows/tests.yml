name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Audit dependencies for security advisories
        run: composer audit --no-interaction

  tests:
    name: PHP ${{ matrix.php }} ${{ matrix.ts }} - ${{ matrix.loop }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
        ts: [nts, zts]
        loop: [epoll, kqueue, select]
        include:
          - loop: epoll
            os: ubuntu-24.04
            extension: epoll
          - loop: kqueue
            os: macos-15
            extension: kqueue
          - loop: select
            os: ubuntu-24.04
            extension: ''

    env:
      FORTE_LOOP: ${{ matrix.loop }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, sockets
          tools: composer, pie
          coverage: none
        env:
          phpts: ${{ matrix.ts == 'zts' && 'ts' || 'nts' }}

      - name: Install the loop extension
        if: matrix.extension != ''
        run: sudo pie install php-io-extensions/${{ matrix.extension }}

      - name: Start Redis (Linux)
        if: runner.os == 'Linux'
        run: docker run -d --name redis -p 6379:6379 redis:7

      - name: Start Redis (macOS)
        if: runner.os == 'macOS'
        run: brew install redis && brew services start redis

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Report the loop driver
        run: php -r 'require "vendor/autoload.php"; echo ProjectSaturnStudios\Forte\Servers\Forte\Loop\Loop::create(getenv("FORTE_LOOP"))->driver(), PHP_EOL;'

      - name: Run the suite
        run: vendor/bin/pest --ci
